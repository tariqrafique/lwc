[package]
name = "lwc-js"
version = "0.1.0"
edition = "2024"

[dependencies]
lwc-shared = { path = "../lwc-shared" }
oxc = { workspace = true, features = ["ast_visit", "codegen", "transformer", "semantic"] }
oxc_sourcemap = "9.0.0"

[dev-dependencies]
# Error-shape tests pin the JS facade (`@lwc/compiler` transformers/javascript.ts), which lives in lwc-compiler.
lwc-compiler = { path = "../lwc-compiler" }
serde_json = "1"
repo-tracked = { path = "../repo-tracked" }
