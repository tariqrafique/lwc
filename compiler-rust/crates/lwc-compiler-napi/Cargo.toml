[package]
name = "lwc-compiler-napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
lwc-compiler = { path = "../lwc-compiler" }
lwc-shared = { path = "../lwc-shared" }
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi-derive = "2"

[build-dependencies]
napi-build = "2"
