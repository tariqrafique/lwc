[package]
name = "lwc-template"
version = "0.1.0"
edition = "2024"
description = "Rust port of @lwc/template-compiler (ESM emit, behavioral goldens)"

[dependencies]
lwc-shared = { path = "../lwc-shared" }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_ecmascript = { workspace = true }
oxc_syntax = { workspace = true }
parse5 = { git = "https://github.com/tariqrafique/parse5-rust", rev = "e3520ba03c9af27eb8dd05d08960b094305910d8" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
