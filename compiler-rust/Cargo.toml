[workspace]
resolver = "2"
members = ["crates/*", "tools/semdiff"]

[workspace.dependencies]
oxc = "0.156"
# AB-D0004: the template IR holds a borrowed oxc AST (lwc-shared: type crates only).
oxc_allocator = "0.156"
oxc_ast = "0.156"
oxc_span = "0.156"
oxc_parser = "0.156"
oxc_ast_visit = "0.156"
oxc_ecmascript = "0.156"
oxc_syntax = "0.156"
