# Rust workspace CI (S5, CUTOVER C8). Runs on tariqrafique/lwc branch rust-compiler (D-0202), whose root is the lwc
# fork tree with this workspace at compiler-rust/ (D-0237). The push routine copies only this file to the branch-root
# .github/workflows/, so every step runs in compiler-rust/ and nothing reads files outside it (no composite actions).
# Artifacts are tarballs only: no npm publish, no registry credentials (D-0202).
name: rust-ci
on:
  push:
    branches: [rust-compiler]
  pull_request:
    branches: [rust-compiler]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: compiler-rust
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LWC_SHA: b9e8007f9810edb59596536b596f80ca6c0d3fab # pinned oracle (/workspace/lwc on the box)
  LWC_ROOT: /workspace/lwc
jobs:
  rust-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (compiler-rust/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain && cargo fmt --version && cargo clippy --version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: oracle salesforce/lwc @ LWC_SHA -> /workspace/lwc (full build; tests read its dist)
        run: .github/ci/oracle.sh yarn build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-rust -> target
      - name: cargo fmt --all --check (D-0235)
        run: cargo fmt --all --check
      - name: cargo fetch --locked (D-0234)
        run: cargo fetch --locked
      - name: cargo check --workspace --locked (D-0225)
        run: cargo check --workspace --all-targets --locked
      - name: clippy (shrink-only ratchet, .github/ci/clippy-baseline.txt)
        run: .github/ci/clippy-ratchet.sh
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  napi:
    strategy:
      fail-fast: false
      matrix:
        include:
          # S6 adds linux-arm64-gnu, darwin-x64, darwin-arm64, win32-x64-msvc.
          - triple: linux-x64-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: rust toolchain (compiler-rust/rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: oracle salesforce/lwc @ LWC_SHA -> /workspace/lwc (@lwc/ssr-compiler only)
        run: .github/ci/oracle.sh npx nx run @lwc/ssr-compiler:build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-rust -> target
      - name: cargo fetch --locked (D-0234)
        run: cargo fetch --locked
      - name: napi build + npm pack (${{ matrix.triple }})
        run: .github/ci/napi-pack.sh "$RUNNER_TEMP/tarballs" ${{ matrix.triple }}
      - name: ssr-compile-js oracle vs the packed napi, SSR_ORACLE_NAPI unset (D-0226)
        run: .github/ci/ssr-oracle-gate.sh "$RUNNER_TEMP/tarballs" ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-${{ matrix.triple }}
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
